<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f5f4f0;--surface:#ffffff;--surface2:#f0ede8;
    --text:#1a1918;--text2:#6b6760;--text3:#9e9b97;
    --accent:#4a3fa5;--accent-light:#eeecfb;--accent-text:#3730a3;
    --green:#2d6a2d;--green-light:#e8f5e8;
    --red:#b83232;--red-light:#fdeaea;
    --amber:#9a6200;--amber-light:#fef3dc;
    --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
    --radius:14px;--radius-sm:10px;--radius-xs:7px;
    --font:'DM Sans',system-ui,-apple-system,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media(prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#141312;--surface:#1e1d1b;--surface2:#282520;
      --text:#f0ede8;--text2:#9e9b97;--text3:#6b6760;
      --accent:#7c73e6;--accent-light:#2a2550;--accent-text:#a8a2f0;
      --green:#5aad5a;--green-light:#1a2e1a;
      --red:#e06060;--red-light:#2e1a1a;
      --amber:#e0a830;--amber-light:#2e2410;
      --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141312;--surface:#1e1d1b;--surface2:#282520;
    --text:#f0ede8;--text2:#9e9b97;--text3:#6b6760;
    --accent:#7c73e6;--accent-light:#2a2550;--accent-text:#a8a2f0;
    --green:#5aad5a;--green-light:#1a2e1a;
    --red:#e06060;--red-light:#2e1a1a;
    --amber:#e0a830;--amber-light:#2e2410;
    --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:16px;line-height:1.5}
  #root{min-height:100%}
  .app{max-width:480px;margin:0 auto;padding:16px 16px 40px}
  .header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 20px}
  .header h1{font-size:22px;font-weight:600;letter-spacing:-0.3px}
  .btn-icon{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-xs);width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:20px;transition:all 0.15s;flex-shrink:0}
  .btn-icon:hover{background:var(--surface2)}
  .stack-list{display:flex;flex-direction:column;gap:10px}
  .stack-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all 0.15s;-webkit-user-select:none;user-select:none}
  .stack-card:hover{border-color:var(--border2);transform:translateY(-1px)}
  .stack-card:active{transform:translateY(0);background:var(--surface2)}
  .emoji-box{width:50px;height:50px;border-radius:var(--radius-sm);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
  .stack-info{flex:1;min-width:0}
  .stack-name{font-size:15px;font-weight:600;letter-spacing:-0.1px}
  .stack-sub{font-size:12px;color:var(--text2);margin-top:2px}
  .progress-bar{height:4px;border-radius:2px;background:var(--surface2);margin-top:8px;overflow:hidden}
  .progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width 0.4s ease}
  .chevron{color:var(--text3);font-size:20px;font-weight:300}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
  .modal{background:var(--surface);border-radius:24px 24px 0 0;padding:24px 20px calc(36px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1)}
  @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-handle{width:40px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 20px}
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .modal-title{font-size:18px;font-weight:600;letter-spacing:-0.2px}
  .form-section{margin-bottom:20px}
  .form-label{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.06em}
  .form-input{width:100%;padding:12px 14px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);font-size:15px;font-family:var(--font);background:var(--bg);color:var(--text);outline:none;resize:none;transition:border-color 0.15s}
  .form-input:focus{border-color:var(--accent)}
  .emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .emoji-pick{width:100%;aspect-ratio:1;border-radius:var(--radius-xs);background:var(--surface2);border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:all 0.15s}
  .emoji-pick:hover{background:var(--accent-light)}
  .emoji-pick.selected{border-color:var(--accent);background:var(--accent-light)}
  .btn-row{display:flex;gap:10px;margin-top:8px}
  .btn{padding:12px 18px;border-radius:var(--radius-sm);font-size:15px;font-weight:500;font-family:var(--font);cursor:pointer;border:1.5px solid var(--border2);background:var(--surface);color:var(--text);flex:1;transition:all 0.15s}
  .btn:hover{background:var(--surface2)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{opacity:0.9}
  .btn.primary:disabled{opacity:0.4;cursor:not-allowed}
  .detail-header{display:flex;align-items:center;gap:12px;padding:12px 0 18px}
  .back-btn{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-xs);width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:18px;flex-shrink:0;transition:background 0.15s}
  .back-btn:hover{background:var(--surface2)}
  .detail-title{font-size:20px;font-weight:600;letter-spacing:-0.3px}
  .progress-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .progress-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--text2)}
  .reset-btn{background:none;border:none;cursor:pointer;font-size:12px;font-family:var(--font);color:var(--red);font-weight:500}
  .learn-btn{width:100%;padding:13px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;border:none;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.15s;letter-spacing:-0.1px}
  .learn-btn:hover{opacity:0.9;transform:translateY(-1px)}
  .learn-btn:active{transform:translateY(0)}
  .section-row{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px}
  .section-header{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em}
  .card-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 14px;display:flex;align-items:center;gap:12px;margin-bottom:7px;transition:border-color 0.15s}
  .card-item:hover{border-color:var(--border2)}
  .dots{display:flex;gap:4px;flex-direction:column;align-items:center}
  .dots-row{display:flex;gap:4px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border2);transition:all 0.2s}
  .dot.green{background:var(--green);border-color:var(--green)}
  .dot.amber{background:var(--amber);border-color:var(--amber)}
  .dot-label{font-size:9px;color:var(--text3);margin-top:2px}
  .card-texts{flex:1;min-width:0}
  .card-q{font-size:14px;font-weight:500}
  .card-a{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .delete-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:2px 6px;border-radius:6px;line-height:1;transition:all 0.15s;font-family:var(--font)}
  .delete-btn:hover{color:var(--red);background:var(--red-light)}
  .learn-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:200;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;left:50%;transform:translateX(-50%);animation:fadeIn 0.2s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .learn-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-shrink:0}
  .learn-counter{font-size:14px;color:var(--text2);font-weight:500}
  .progress-dots{display:flex;gap:5px;align-items:center}
  .pdot{width:7px;height:7px;border-radius:50%;background:var(--border2);transition:all 0.3s}
  .pdot.done{background:var(--green)}
  .pdot.active{background:var(--accent);transform:scale(1.3)}
  .card-flip-wrap{flex:1;display:flex;align-items:center;justify-content:center;perspective:1200px;cursor:pointer;padding:8px 0;min-height:0}
  .card-flip{width:100%;max-width:440px;height:100%;max-height:420px;min-height:240px;position:relative;transform-style:preserve-3d;transition:transform 0.45s cubic-bezier(0.4,0,0.2,1)}
  .card-flip.flipped{transform:rotateY(180deg)}
  .card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);padding:22px;display:flex;flex-direction:column;overflow:hidden}
  .card-face.back{transform:rotateY(180deg)}
  .card-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;margin-bottom:14px;letter-spacing:0.04em;width:fit-content;flex-shrink:0}
  .badge-q{background:var(--accent-light);color:var(--accent-text)}
  .badge-a{background:var(--green-light);color:var(--green)}
  .card-text{flex:1;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500;text-align:center;line-height:1.55;letter-spacing:-0.2px;overflow-y:auto;white-space:pre-line}
  .card-pips{display:flex;gap:5px;justify-content:center;margin-top:10px;flex-shrink:0}
  .pip{width:8px;height:8px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border2);transition:all 0.3s}
  .pip.filled{background:var(--green);border-color:var(--green)}
  .hint{text-align:center;font-size:12px;color:var(--text3);margin:12px 0 8px;font-weight:400;flex-shrink:0}
  .action-btns{display:flex;gap:12px;flex-shrink:0;padding-bottom:8px;animation:slideUpButtons 0.25s cubic-bezier(0.34,1.3,0.64,1)}
  @keyframes slideUpButtons{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .action-btn{flex:1;padding:14px;border-radius:var(--radius-sm);border:none;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.15s;letter-spacing:-0.1px}
  .action-btn:active{transform:scale(0.97)}
  .action-btn.wrong{background:var(--red-light);color:var(--red)}
  .action-btn.wrong:hover{filter:brightness(0.95)}
  .action-btn.right{background:var(--green-light);color:var(--green)}
  .action-btn.right:hover{filter:brightness(0.95)}
  .finish-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px 32px;z-index:200;text-align:center;animation:fadeIn 0.3s ease;max-width:480px;margin:0 auto;left:50%;transform:translateX(-50%)}
  .finish-emoji{font-size:80px;line-height:1;margin-bottom:8px}
  .finish-title{font-size:26px;font-weight:600;letter-spacing:-0.5px}
  .finish-sub{font-size:15px;color:var(--text2);line-height:1.6;max-width:280px}
  .empty-state{text-align:center;padding:48px 20px;color:var(--text2);font-size:14px}
  .empty-icon{font-size:40px;margin-bottom:12px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState}=React;
const EMOJIS=["💊","💉","🩺","🚑","🧠","🫀","📚","🧪","🌍","📐","🎨","💻","🔬","📖"];

const DEFAULTS=[
  {id:"btm",name:"Analgesie: BTM & Nichtopioide",emoji:"💊",karten:[
    {id:"b1",frage:"Fentanyl – welche Gruppe?",antwort:"Opioid (starkes Analgetikum, BtM)",richtig:0},
    {id:"b2",frage:"Fentanyl – Wirkung?",antwort:"• starke Schmerzstillung\n• dämpft die Schmerzverarbeitung im ZNS\n• beruhigend / sedierend\n• kann die Atmung deutlich dämpfen",richtig:0},
    {id:"b3",frage:"Fentanyl in einem Satz",antwort:"Sehr starkes Schmerzmittel → Schmerz wird im Gehirn weniger wahrgenommen.",richtig:0},
    {id:"b4",frage:"Morphin – welche Gruppe?",antwort:"Opioid (starkes Analgetikum, BtM)",richtig:0},
    {id:"b5",frage:"Morphin – Wirkung?",antwort:"• starke Schmerzstillung\n• sedierend\n• angstlösend\n• kann die Atmung dämpfen\n• kann den Blutdruck senken",richtig:0},
    {id:"b6",frage:"Unterschied Fentanyl ↔ Morphin?",antwort:"Beide Opioide, grundsätzlich ähnliche Wirkung.\n\nFentanyl: sehr potent, schnell wirksam, relativ kurze Wirkdauer.\nMorphin: ebenfalls stark, andere Pharmakokinetik, stärker ausgeprägte histaminbedingte Effekte möglich.",richtig:0},
    {id:"b7",frage:"Merksatz Fentanyl + Morphin",antwort:"Fentanyl + Morphin = Opioide\n→ Schmerz ↓ + ZNS/Atmung ↓",richtig:0},
    {id:"b8",frage:"Esketamin (Ketanest S) – welche Gruppe?",antwort:"Dissoziatives Anästhetikum / Analgetikum – NMDA-Antagonist.\nKein Opioid!",richtig:0},
    {id:"b9",frage:"Esketamin – Wirkung?",antwort:"• starke Schmerzstillung\n• Bewusstseinsveränderung / Dissoziation\n• beeinflusst Reflexe und Kreislauf anders als Opioide\n• Atemdepression deutlich geringer als bei klassischen Opioiden, aber trotzdem möglich",richtig:0},
    {id:"b10",frage:"Warum ist Esketamin kein Opioid?",antwort:"Opioide dämpfen die Schmerzverarbeitung über Opioidrezeptoren.\nEsketamin blockiert vor allem NMDA-Rezeptoren und erzeugt eine Dissoziation → anderer Wirkmechanismus.",richtig:0},
    {id:"b11",frage:"Bewusstsein: Fentanyl/Morphin vs. Esketamin?",antwort:"Fentanyl + Morphin: Bewusstsein gedämpft\nEsketamin: Bewusstsein dissoziiert",richtig:0},
    {id:"b12",frage:"Atmung im Vergleich der drei starken Analgetika?",antwort:"Fentanyl: kann stark ↓\nMorphin: kann stark ↓\nEsketamin: meist weniger ↓ (aber möglich)",richtig:0},
    {id:"b13",frage:"Typisches Bild der drei starken Analgetika?",antwort:"Fentanyl: starke Analgesie\nMorphin: starke Analgesie\nEsketamin: Analgesie + Dissoziation",richtig:0},
    {id:"b14",frage:"Die drei starken Analgetika ganz simpel",antwort:"Fentanyl → Opioid, starke Analgesie, ZNS-/Atemdepression möglich\nMorphin → Opioid, starke Analgesie, ZNS-/Atemdepression möglich\nEsketamin → kein Opioid, starke Analgesie + Dissoziation, anderer Wirkmechanismus",richtig:0},
    {id:"b15",frage:"Metamizol / Novaminsulfon (Novalgin) – Gruppe?",antwort:"Nichtopioid-Analgetikum",richtig:0},
    {id:"b16",frage:"Metamizol – Wirkung?",antwort:"• starke Schmerzstillung\n• fiebersenkend\n• krampflösend (spasmolytisch)\n\nMerksatz: starkes Nichtopioid gegen Schmerz + Fieber + Krampf.",richtig:0},
    {id:"b17",frage:"Paracetamol – Gruppe & Wirkung?",antwort:"Nichtopioid-Analgetikum\n→ Schmerz ↓\n→ Fieber ↓\n\nMerksatz: Paracetamol = Schmerz + Fieber.",richtig:0},
    {id:"b18",frage:"Unterschied Metamizol ↔ Paracetamol?",antwort:"Beide Nichtopioide gegen Schmerz und Fieber.\n\nMetamizol: stärker analgetisch, zusätzlich spasmolytisch (z. B. Koliken).\nParacetamol: schwächer, kein relevanter krampflösender Effekt.",richtig:0},
    {id:"b19",frage:"Opioid vs. Nichtopioid – der Kernunterschied",antwort:"Opioide (Fentanyl, Morphin): wirken über Opioidrezeptoren im ZNS, sehr stark, Atemdepression + Sedierung möglich.\n\nNichtopioide (Metamizol, Paracetamol): wirken peripher/zentral ohne Opioidrezeptoren, keine Atemdepression, kein Suchtpotenzial.",richtig:0},
    {id:"b20",frage:"Welche dieser Analgetika sind echte BtM nach BtMG?",antwort:"Fentanyl und Morphin → ja, BtM.\nEsketamin/Ketamin → in Deutschland kein BtM, aber verschreibungspflichtig; viele Rettungsdienste verwahren und dokumentieren es trotzdem BtM-ähnlich.\nMetamizol, Paracetamol → kein BtM.\n\n(Regelungen im Detail immer nach eurer Dienstanweisung prüfen.)",richtig:0}
  ]},
  {id:"reani",name:"Reanimation & Herzrhythmus",emoji:"❤️",karten:[
    {id:"r1",frage:"Adrenalin – Gruppe?",antwort:"Sympathomimetikum / Katecholamin",richtig:0},
    {id:"r2",frage:"Adrenalin – Wirkung?",antwort:"• Herzfrequenz ↑\n• Herzkraft ↑\n• Gefäßverengung ↑\n• Blutdruck ↑\n• Bronchien werden weit",richtig:0},
    {id:"r3",frage:"Adrenalin in einem Satz",antwort:"Herz kräftiger + schneller, Gefäße enger, Bronchien weiter.",richtig:0},
    {id:"r4",frage:"Amiodaron – Gruppe & Wirkung?",antwort:"Antiarrhythmikum\n\nStabilisiert die elektrische Erregungsleitung des Herzens und kann gefährliche Herzrhythmusstörungen unterbrechen.\n→ Herzrhythmus stabilisieren",richtig:0},
    {id:"r5",frage:"Atropin – Gruppe & Wirkung?",antwort:"Parasympatholytikum / Anticholinergikum\n\nBlockiert die Wirkung von Acetylcholin am Herzen → Herzfrequenz ↑\n\nMerksatz: Atropin nimmt die Bremse vom Herzen.",richtig:0},

    {id:"r7",frage:"Atropin ↔ Adenosin – warum leicht zu verwechseln?",antwort:"Beide wirken am Reizleitungssystem, aber gegenläufig:\n\nAtropin = Bremse weg → Frequenz ↑ (bei Bradykardie)\nAdenosin = Bremse rein → AV-Überleitung kurz blockiert (bei bestimmten Tachykardien)",richtig:0},
    {id:"r8",frage:"Magnesium – Gruppe & Wirkung?",antwort:"Elektrolyt\n\nBeeinflusst die elektrische Erregbarkeit und Stabilität des Herzmuskels → kann bestimmte Rhythmusstörungen behandeln.\n\nMerksatz: elektrische Stabilisierung des Herzens.",richtig:0}

  {id:"kreislauf",name:"Blutdruck & Kreislauf",emoji:"🫀",karten:[

    {id:"k2",frage:"Cafedrin/Theodrenalin (Akrinor) – Gruppe & Wirkung?",antwort:"Sympathomimetikum\n\n→ Blutdruck ↑\n→ Kreislauf stabilisieren\n→ Herzleistung/Frequenz können ↑\n\nMerksatz: Akrinor = Kreislauf hochbringen.",richtig:0},
    {id:"k3",frage:"Urapidil (Ebrantil) – Gruppe & Wirkung?",antwort:"Antihypertensivum / α₁-Blocker\n\n→ Gefäße entspannen\n→ peripherer Widerstand ↓\n→ Blutdruck ↓\n\nMerksatz: Gefäße auf → Blutdruck runter.",richtig:0},
    {id:"k4",frage:"Metoprolol (Beloc) – Gruppe & Wirkung?",antwort:"β₁-Blocker\n\n→ Herzfrequenz ↓\n→ Herzkraft ↓\n→ Blutdruck kann ↓\n\nMerksatz: Metoprolol = Herz wird gebremst.",richtig:0},

    {id:"k6",frage:"Übersicht: Welches Medikament hebt, welches senkt den Blutdruck?",antwort:"Hoch: Noradrenalin (Gefäße eng), Akrinor (Kreislauf stützen), Adrenalin\n\nRunter: Urapidil (Gefäße weit), Nitroglycerin (Gefäße weit + Herz entlasten), Metoprolol (Herz bremsen)",richtig:0},
    {id:"k7",frage:"Urapidil ↔ Nitroglycerin – beide senken den Druck. Unterschied?",antwort:"Urapidil: α₁-Blockade → v. a. peripherer Widerstand (Nachlast) ↓\nNitroglycerin: Nitrat → v. a. venöse Gefäße weit, Vorlast ↓, Herz wird entlastet (deshalb bei ACS/Lungenödem)",richtig:0}

    {id:"n4",frage:"Rocuronium – Gruppe & Wirkung?",antwort:"Nichtdepolarisierendes Muskelrelaxans\n\n→ blockiert die neuromuskuläre Übertragung\n→ Skelettmuskulatur wird gelähmt\n\n⚠️ Macht NICHT bewusstlos und NICHT schmerzfrei.\nRocuronium = Muskeln aus, nicht Gehirn aus.",richtig:0},
    {id:"n5",frage:"Midazolam ↔ Propofol – Unterschied?",antwort:"Midazolam: Benzodiazepin, bremst das Gehirn, sediert, wirkt antikonvulsiv.\nPropofol: Anästhetikum, schaltet das Bewusstsein aus (Narkose), nicht antikonvulsiv gedacht, keine Analgesie.",richtig:0},
    {id:"n6",frage:"Die fünf sauber trennen – wer macht was?",antwort:"Fentanyl / Morphin → Schmerz über Opioidrezeptoren\nEsketamin → Schmerz + Dissoziation über NMDA\nMidazolam → Gehirn bremsen\nPropofol → Bewusstsein ausschalten\nRocuronium → Muskeln ausschalten",richtig:0},

    {id:"c2",frage:"Heparin – Gruppe & Wirkung?",antwort:"Antikoagulans\n\n→ hemmt die Blutgerinnung\n→ verhindert/verlangsamt die Bildung von Fibrin\n\nMerksatz: Gerinnung bremsen.",richtig:0},
    {id:"c3",frage:"ASS ↔ Heparin – wo greifen sie an?",antwort:"ASS → hemmt die Thrombozyten\nHeparin → hemmt die Gerinnungskaskade\n\nBeides beeinflusst die Gerinnung, aber an unterschiedlichen Stellen.",richtig:0},
    {id:"c4",frage:"Tranexamsäure – Gruppe & Wirkung?",antwort:"Antifibrinolytikum\n\n→ verhindert den Abbau von Fibrin\n→ Blutgerinnsel werden stabilisiert\n\nMerksatz: Gerinnsel stabil halten.",richtig:0},
    {id:"c5",frage:"Warum ist Tranexamsäure das Gegenteil der anderen beiden?",antwort:"ASS und Heparin bremsen die Gerinnselbildung (Ziel: Gefäß offen halten).\nTranexamsäure schützt ein bestehendes Gerinnsel vor dem Abbau (Ziel: Blutung stoppen).",richtig:0}
  ]},
  {id:"stoffwechsel",name:"Flüssigkeit & Zucker",emoji:"💧",karten:[
    {id:"f1",frage:"Furosemid (Lasix) – Gruppe & Wirkung?",antwort:"Schleifendiuretikum\n\n→ Niere scheidet mehr Natrium + Wasser aus\n→ Flüssigkeitsmenge im Körper ↓\n→ Volumenbelastung sinkt\n\nMerksatz: Wasser raus.",richtig:0},
    {id:"f2",frage:"Glucose 40 % – Gruppe & Wirkung?",antwort:"Kohlenhydrat / Glukose\n→ Blutzucker ↑\n\nMerksatz: Zucker direkt rein (parenteral, i. v.).",richtig:0},
    {id:"f3",frage:"Jubin – was ist das und wo ist der Unterschied?",antwort:"Wirkstoff ist ebenfalls Glucose → Blutzucker ↑\n\nUnterschied: Jubin ist eine orale Glukosepaste/-lösung.\nGlucose 40 % = parenteral, Jubin = oral (nur bei wachem, schluckfähigem Patienten).",richtig:0}

  {id:"kompetenz",name:"Wer darf was geben?",emoji:"⚖️",karten:[
    {id:"w0",frage:"Wichtigster Merksatz zu diesem Stapel",antwort:"Es gibt keine bundesweit einheitliche Liste.\nWas ein Notfallsanitäter eigenverantwortlich geben darf, legt der ÄLRD deines Rettungsdienstbereichs per SAA/SOP fest – je nach Bundesland unterschiedlich.\n\nDiese Karten sind die Logik dahinter, nicht deine Dienstanweisung.",richtig:0},
    {id:"w1",frage:"Was regelt § 2c NotSanG?",antwort:"Die heilkundlichen Maßnahmen, die Notfallsanitäter durchführen dürfen:\n• eigenverantwortlich im Rahmen der Ausbildung bis zum Eintreffen des Arztes, wenn sonst ein kritischer Zustand droht\n• sowie Maßnahmen, die der ÄLRD vorab freigegeben hat (SAA/SOP)",richtig:0},
    {id:"w2",frage:"Warum sind BtM rechtlich eine Sonderrolle?",antwort:"Das BtMG erlaubt Verschreibung und Anwendung grundsätzlich nur durch Ärzte.\nIm Rettungsdienst darf ein NotSan BtM nur nach ärztlicher Freigabe/Delegation bzw. im Rahmen der ÄLRD-Vorgaben anwenden – und die Dokumentation (BtM-Buch) ist Pflicht.",richtig:0},

function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function fp(karten){if(!karten.length)return 0;return karten.filter(k=>k.richtig>=3).length/karten.length}
function load(){try{const d=localStorage.getItem("lernkarten_v4");return d?JSON.parse(d):null}catch(e){return null}}
function save(d){try{localStorage.setItem("lernkarten_v4",JSON.stringify(d))}catch(e){}}

function App(){
  const [stapel,setStapel]=useState(()=>load()||DEFAULTS);
  const [view,setView]=useState("list");
  const [activeId,setActiveId]=useState(null);
  const [modal,setModal]=useState(null);
  const [lernen,setLernen]=useState(false);
  const update=fn=>setStapel(prev=>{const n=fn([...prev]);save(n);return n});
  const addStapel=(name,emoji)=>update(s=>[...s,{id:uid(),name,emoji,karten:[]}]);
  const delStapel=id=>update(s=>s.filter(x=>x.id!==id));
  const addKarte=(sid,frage,antwort)=>update(s=>s.map(x=>x.id===sid?{...x,karten:[...x.karten,{id:uid(),frage,antwort,richtig:0}]}:x));
  const delKarte=(sid,kid)=>update(s=>s.map(x=>x.id===sid?{...x,karten:x.karten.filter(k=>k.id!==kid)}:x));
  const richtigGewusst=(sid,kid)=>update(s=>s.map(x=>x.id===sid?{...x,karten:x.karten.map(k=>k.id===kid?{...k,richtig:k.richtig+1}:k)}:x));
  const resetAll=sid=>update(s=>s.map(x=>x.id===sid?{...x,karten:x.karten.map(k=>({...k,richtig:0}))}:x));
  const aktStapel=stapel.find(x=>x.id===activeId);

  if(lernen&&aktStapel) return React.createElement(LernView,{stapel:aktStapel,onDone:()=>setLernen(false),richtigGewusst:kid=>richtigGewusst(activeId,kid)});
  return React.createElement(React.Fragment,null,
    view==="list"&&React.createElement(ListView,{stapel,onOpen:id=>{setActiveId(id);setView("detail")},onAdd:()=>setModal("stapel")}),
    view==="detail"&&aktStapel&&React.createElement(DetailView,{stapel:aktStapel,onBack:()=>setView("list"),onLernen:()=>setLernen(true),onAddKarte:()=>setModal("karte"),onDelKarte:kid=>delKarte(activeId,kid),onReset:()=>resetAll(activeId),onDelStapel:()=>{if(confirm("Ganzen Stapel löschen?")){delStapel(activeId);setView("list")}}}),
    modal==="stapel"&&React.createElement(StapelModal,{onClose:()=>setModal(null),onSave:(n,e)=>{addStapel(n,e);setModal(null)}}),
    modal==="karte"&&aktStapel&&React.createElement(KarteModal,{onClose:()=>setModal(null),onSave:(f,a)=>addKarte(activeId,f,a)})
  );
}

    ),

function LernView({stapel,onDone,richtigGewusst}){
  const [idx,setIdx]=useState(0);
  const [flipped,setFlipped]=useState(false);
  const [fertig,setFertig]=useState(false);
  const [local,setLocal]=useState(()=>stapel.karten.map(k=>({...k})));

  const offene=local.filter(k=>k.richtig<3);

  if(fertig||!offene.length) return React.createElement("div",{className:"finish-screen"},
    React.createElement("div",{className:"finish-emoji"},"🎉"),
    React.createElement("div",{className:"finish-title"},"Alle Karten gewusst!"),
    React.createElement("div",{className:"finish-sub"},"Super gemacht! Du hast alle Karten in diesem Durchgang richtig beantwortet."),
    React.createElement("button",{className:"btn primary",style:{maxWidth:"240px",marginTop:"8px"},onClick:onDone},"Zurück zur Übersicht")
  );

  const karte=offene[Math.min(idx,offene.length-1)];
  function flip(){setFlipped(f=>!f)}
  function next(gewusst){
    if(gewusst){
      richtigGewusst(karte.id);
      const updated=local.map(k=>k.id===karte.id?{...k,richtig:k.richtig+1}:k);
      setLocal(updated);
      const neu=updated.filter(k=>k.richtig<3);
      if(!neu.length){setFertig(true);return;}
      setFlipped(false);setIdx(i=>Math.min(i,neu.length-1));
    } else {
      setFlipped(false);
      setIdx(i=>(i+1)%offene.length);
    }
  }

  return React.createElement("div",{className:"learn-screen"},
    React.createElement("div",{className:"learn-top"},
