<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f5f4f0;--surface:#ffffff;--surface2:#f0ede8;
    --text:#1a1918;--text2:#6b6760;--text3:#9e9b97;
    --accent:#4a3fa5;--accent-light:#eeecfb;--accent-text:#3730a3;
    --green:#2d6a2d;--green-light:#e8f5e8;
    --red:#b83232;--red-light:#fdeaea;
    --amber:#9a6200;--amber-light:#fef3dc;
    --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
    --radius:14px;--radius-sm:10px;--radius-xs:7px;
    --font:'DM Sans',sans-serif;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#141312;--surface:#1e1d1b;--surface2:#282520;
      --text:#f0ede8;--text2:#9e9b97;--text3:#6b6760;
      --accent:#7c73e6;--accent-light:#2a2550;--accent-text:#a8a2f0;
      --green:#5aad5a;--green-light:#1a2e1a;
      --red:#e06060;--red-light:#2e1a1a;
      --amber:#e0a830;--amber-light:#2e2410;
      --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
    }
  }
  html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:16px;line-height:1.5}
  #root{min-height:100vh}
  .app{max-width:480px;margin:0 auto;padding:16px 16px 40px}
  /* Header */
  .header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 20px}
  .header h1{font-size:22px;font-weight:600;letter-spacing:-0.3px}
  .btn-icon{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-xs);width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:20px;transition:all 0.15s;flex-shrink:0}
  .btn-icon:hover{background:var(--surface2)}
  /* Stack list */
  .stack-list{display:flex;flex-direction:column;gap:10px}
  .stack-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all 0.15s;-webkit-user-select:none;user-select:none}
  .stack-card:hover{border-color:var(--border2);transform:translateY(-1px)}
  .stack-card:active{transform:translateY(0);background:var(--surface2)}
  .emoji-box{width:50px;height:50px;border-radius:var(--radius-sm);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
  .stack-info{flex:1;min-width:0}
  .stack-name{font-size:15px;font-weight:600;letter-spacing:-0.1px}
  .stack-sub{font-size:12px;color:var(--text2);margin-top:2px}
  .progress-bar{height:4px;border-radius:2px;background:var(--surface2);margin-top:8px;overflow:hidden}
  .progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width 0.4s ease}
  .chevron{color:var(--text3);font-size:20px;font-weight:300}
  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
  .modal{background:var(--surface);border-radius:24px 24px 0 0;padding:24px 20px 36px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1)}
  @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-handle{width:40px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 20px}
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .modal-title{font-size:18px;font-weight:600;letter-spacing:-0.2px}
  .form-section{margin-bottom:20px}
  .form-label{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.06em}
  .form-input{width:100%;padding:12px 14px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);font-size:15px;font-family:var(--font);background:var(--bg);color:var(--text);outline:none;resize:none;transition:border-color 0.15s}
  .form-input:focus{border-color:var(--accent)}
  .emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .emoji-pick{width:100%;aspect-ratio:1;border-radius:var(--radius-xs);background:var(--surface2);border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:all 0.15s}
  .emoji-pick:hover{background:var(--accent-light)}
  .emoji-pick.selected{border-color:var(--accent);background:var(--accent-light)}
  .btn-row{display:flex;gap:10px;margin-top:8px}
  .btn{padding:12px 18px;border-radius:var(--radius-sm);font-size:15px;font-weight:500;font-family:var(--font);cursor:pointer;border:1.5px solid var(--border2);background:var(--surface);color:var(--text);flex:1;transition:all 0.15s}
  .btn:hover{background:var(--surface2)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{opacity:0.9}
  .btn.primary:disabled{opacity:0.4;cursor:not-allowed}
  /* Detail */
  .detail-header{display:flex;align-items:center;gap:12px;padding:12px 0 18px}
  .back-btn{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-xs);width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:18px;flex-shrink:0;transition:background 0.15s}
  .back-btn:hover{background:var(--surface2)}
  .detail-title{font-size:20px;font-weight:600;letter-spacing:-0.3px}
  .progress-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .progress-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--text2)}
  .reset-btn{background:none;border:none;cursor:pointer;font-size:12px;font-family:var(--font);color:var(--red);font-weight:500}
  .learn-btn{width:100%;padding:13px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;border:none;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.15s;letter-spacing:-0.1px}
  .learn-btn:hover{opacity:0.9;transform:translateY(-1px)}
  .learn-btn:active{transform:translateY(0)}
  .section-row{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px}
  .section-header{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em}
  .card-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 14px;display:flex;align-items:center;gap:12px;margin-bottom:7px;transition:border-color 0.15s}
  .card-item:hover{border-color:var(--border2)}
  .dots{display:flex;gap:4px;flex-direction:column;align-items:center}
  .dots-row{display:flex;gap:4px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border2);transition:all 0.2s}
  .dot.green{background:var(--green);border-color:var(--green)}
  .dot.amber{background:var(--amber);border-color:var(--amber)}
  .dot-label{font-size:9px;color:var(--text3);margin-top:2px}
  .card-texts{flex:1;min-width:0}
  .card-q{font-size:14px;font-weight:500}
  .card-a{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .delete-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:2px 6px;border-radius:6px;line-height:1;transition:all 0.15s;font-family:var(--font)}
  .delete-btn:hover{color:var(--red);background:var(--red-light)}
  /* Learn */
  .learn-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:200;padding:16px;max-width:480px;margin:0 auto;left:50%;transform:translateX(-50%);animation:fadeIn 0.2s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .learn-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-shrink:0}
  .learn-counter{font-size:14px;color:var(--text2);font-weight:500}
  .progress-dots{display:flex;gap:5px;align-items:center}
  .pdot{width:7px;height:7px;border-radius:50%;background:var(--border2);transition:all 0.3s}
  .pdot.done{background:var(--green)}
  .pdot.active{background:var(--accent);transform:scale(1.3)}
  .card-flip-wrap{flex:1;display:flex;align-items:center;justify-content:center;perspective:1200px;cursor:pointer;padding:8px 0}
  .card-flip{width:100%;max-width:440px;height:min(280px,45vw);position:relative;transform-style:preserve-3d;transition:transform 0.45s cubic-bezier(0.4,0,0.2,1)}
  .card-flip.flipped{transform:rotateY(180deg)}
  .card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);padding:22px;display:flex;flex-direction:column}
  .card-face.back{transform:rotateY(180deg)}
  .card-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;margin-bottom:14px;letter-spacing:0.04em;width:fit-content}
  .badge-q{background:var(--accent-light);color:var(--accent-text)}
  .badge-a{background:var(--green-light);color:var(--green)}
  .card-text{flex:1;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;text-align:center;line-height:1.5;letter-spacing:-0.2px}
  .card-pips{display:flex;gap:5px;justify-content:center;margin-top:10px}
  .pip{width:8px;height:8px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border2);transition:all 0.3s}
  .pip.filled{background:var(--green);border-color:var(--green)}
  .hint{text-align:center;font-size:12px;color:var(--text3);margin:12px 0 8px;font-weight:400;flex-shrink:0}
  .action-btns{display:flex;gap:12px;flex-shrink:0;padding-bottom:8px;animation:slideUpButtons 0.25s cubic-bezier(0.34,1.3,0.64,1)}
  @keyframes slideUpButtons{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .action-btn{flex:1;padding:14px;border-radius:var(--radius-sm);border:none;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.15s;letter-spacing:-0.1px}
  .action-btn:active{transform:scale(0.97)}
  .action-btn.wrong{background:var(--red-light);color:var(--red)}
  .action-btn.wrong:hover{filter:brightness(0.95)}
  .action-btn.right{background:var(--green-light);color:var(--green)}
  .action-btn.right:hover{filter:brightness(0.95)}
  /* Finish */
  .finish-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px 32px;z-index:200;text-align:center;animation:fadeIn 0.3s ease;max-width:480px;margin:0 auto;left:50%;transform:translateX(-50%)}
  .finish-emoji{font-size:80px;line-height:1;margin-bottom:8px}
  .finish-title{font-size:26px;font-weight:600;letter-spacing:-0.5px}
  .finish-sub{font-size:15px;color:var(--text2);line-height:1.6;max-width:280px}
  .empty-state{text-align:center;padding:48px 20px;color:var(--text2);font-size:14px}
  .empty-icon{font-size:40px;margin-bottom:12px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useCallback}=React;
const EMOJIS=["📚","🧪","🌍","📐","🎨","🎵","💻","🏛️","🔬","📖","🇩🇪","🇬🇧","🇪🇸","🇫🇷"];
const DEFAULTS=[
  {id:"s1",name:"Englisch",emoji:"🇬🇧",karten:[
    {id:"k1",frage:"What does 'ambiguous' mean?",antwort:"mehrdeutig – etwas, das mehrere Bedeutungen hat",richtig:0},
    {id:"k2",frage:"What does 'perseverance' mean?",antwort:"Ausdauer, Beharrlichkeit",richtig:0},
    {id:"k3",frage:"Translate: 'It is raining cats and dogs'",antwort:"Es regnet in Strömen",richtig:0}
  ]},
  {id:"s2",name:"Mathe",emoji:"📐",karten:[
    {id:"k4",frage:"Was ist der Satz des Pythagoras?",antwort:"a² + b² = c²  –  in einem rechtwinkligen Dreieck",richtig:0},
    {id:"k5",frage:"Wie lautet die Formel für den Kreisumfang?",antwort:"U = 2 · π · r",richtig:0}
  ]}
];
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function fp(karten){if(!karten.length)return 0;return karten.filter(k=>k.richtig>=3).length/karten.length}
function load(){try{const d=localStorage.getItem("lernkarten_v2");return d?JSON.parse(d):null}catch{return null}}
function save(d){try{localStorage.setItem("lernkarten_v2",JSON.stringify(d))}catch{}}

function App(){
  const [stapel,setStapel]=useState(()=>load()||DEFAULTS);
  const [view,setView]=useState("list");
  const [activeId,setActiveId]=useState(null);
  const [modal,setModal]=useState(null);
  const [lernen,setLernen]=useState(false);
  const update=fn=>setStapel(prev=>{const n=fn([...prev]);save(n);return n});
  const addStapel=(name,emoji)=>update(s=>[...s,{id:uid(),name,emoji,karten:[]}]);
  const delStapel=id=>update(s=>s.filter(x=>x.id!==id));
  const addKarte=(sid,frage,antwort)=>update(s=>s.map(x=>x.id===sid?{...x,karten:[...x.karten,{id:uid(),frage,antwort,richtig:0}]}:x));
  const delKarte=(sid,kid)=>update(s=>s.map(x=>x.id===sid?{...x,karten:x.karten.filter(k=>k.id!==kid)}:x));
  const richtigGewusst=(sid,kid)=>update(s=>s.map(x=>x.id===sid?{...x,karten:x.karten.map(k=>k.id===kid?{...k,richtig:k.richtig+1}:k)}:x));
  const resetAll=sid=>update(s=>s.map(x=>x.id===sid?{...x,karten:x.karten.map(k=>({...k,richtig:0}))}:x));
  const aktStapel=stapel.find(x=>x.id===activeId);

  if(lernen&&aktStapel) return React.createElement(LernView,{stapel:aktStapel,onDone:()=>setLernen(false),richtigGewusst:kid=>richtigGewusst(activeId,kid)});
  return React.createElement(React.Fragment,null,
    view==="list"&&React.createElement(ListView,{stapel,onOpen:id=>{setActiveId(id);setView("detail")},onAdd:()=>setModal("stapel")}),
    view==="detail"&&aktStapel&&React.createElement(DetailView,{stapel:aktStapel,onBack:()=>setView("list"),onLernen:()=>setLernen(true),onAddKarte:()=>setModal("karte"),onDelKarte:kid=>delKarte(activeId,kid),onReset:()=>resetAll(activeId)}),
    modal==="stapel"&&React.createElement(StapelModal,{onClose:()=>setModal(null),onSave:(n,e)=>{addStapel(n,e);setModal(null)}}),
    modal==="karte"&&aktStapel&&React.createElement(KarteModal,{onClose:()=>setModal(null),onSave:(f,a)=>addKarte(activeId,f,a)})
  );
}

function ListView({stapel,onOpen,onAdd}){
  return React.createElement("div",{className:"app"},
    React.createElement("div",{className:"header"},
      React.createElement("h1",null,"Meine Stapel"),
      React.createElement("button",{className:"btn-icon",onClick:onAdd,title:"Neuer Stapel"},"+")
    ),
    !stapel.length&&React.createElement("div",{className:"empty-state"},React.createElement("div",{className:"empty-icon"},"📚"),React.createElement("div",null,"Noch keine Stapel.")),
    React.createElement("div",{className:"stack-list"},
      stapel.map(s=>React.createElement("div",{key:s.id,className:"stack-card",onClick:()=>onOpen(s.id)},
        React.createElement("div",{className:"emoji-box"},s.emoji),
        React.createElement("div",{className:"stack-info"},
          React.createElement("div",{className:"stack-name"},s.name),
          React.createElement("div",{className:"stack-sub"},s.karten.length+" Karten · "+s.karten.filter(k=>k.richtig>=3).length+" gewusst"),
          React.createElement("div",{className:"progress-bar"},React.createElement("div",{className:"progress-fill",style:{width:Math.round(fp(s.karten)*100)+"%"}}))
        ),
        React.createElement("span",{className:"chevron"},"›")
      ))
    )
  );
}

function DetailView({stapel,onBack,onLernen,onAddKarte,onDelKarte,onReset}){
  const gewusst=stapel.karten.filter(k=>k.richtig>=3).length;
  return React.createElement("div",{className:"app"},
    React.createElement("div",{className:"detail-header"},
      React.createElement("button",{className:"back-btn",onClick:onBack},"‹"),
      React.createElement("span",{style:{fontSize:"24px"}},stapel.emoji),
      React.createElement("h1",{className:"detail-title"},stapel.name)
    ),
    React.createElement("div",{className:"progress-section"},
      React.createElement("div",{className:"progress-meta"},
        React.createElement("span",null,gewusst+" / "+stapel.karten.length+" gewusst"),
        React.createElement("button",{className:"reset-btn",onClick:onReset},"Zurücksetzen")
      ),
      React.createElement("div",{className:"progress-bar",style:{height:"6px"}},React.createElement("div",{className:"progress-fill",style:{width:Math.round(fp(stapel.karten)*100)+"%"}})),
      stapel.karten.length>0&&React.createElement("button",{className:"learn-btn",onClick:onLernen},React.createElement("span",{style:{fontSize:"13px"}},"▶"),"Jetzt lernen")
    ),
    React.createElement("div",{className:"section-row"},
      React.createElement("div",{className:"section-header"},"Karten ("+stapel.karten.length+")"),
      React.createElement("button",{className:"btn-icon",style:{width:"30px",height:"30px",fontSize:"18px"},onClick:onAddKarte},"+")
    ),
    !stapel.karten.length&&React.createElement("div",{className:"empty-state"},React.createElement("div",{className:"empty-icon"},"✏️"),React.createElement("div",null,"Noch keine Karten.")),
    stapel.karten.map(k=>{
      const g=k.richtig>=3;
      return React.createElement("div",{key:k.id,className:"card-item"},
        React.createElement("div",{className:"dots"},
          React.createElement("div",{className:"dots-row"},[0,1,2].map(i=>React.createElement("div",{key:i,className:"dot"+(i<k.richtig?(g?" green":" amber"):"")}))),
          !g&&React.createElement("div",{className:"dot-label"},k.richtig+"/3")
        ),
        React.createElement("div",{className:"card-texts"},
          React.createElement("div",{className:"card-q"},k.frage),
          React.createElement("div",{className:"card-a"},k.antwort)
        ),
        React.createElement("button",{className:"delete-btn",onClick:e=>{e.stopPropagation();if(confirm("Karte löschen?"))onDelKarte(k.id)}},"×")
      );
    })
  );
}

function LernView({stapel,onDone,richtigGewusst}){
  const [idx,setIdx]=useState(0);
  const [flipped,setFlipped]=useState(false);
  const [fertig,setFertig]=useState(false);
  const [local,setLocal]=useState(()=>stapel.karten.map(k=>({...k})));

  const offene=local.filter(k=>k.richtig<3);

  if(fertig||!offene.length) return React.createElement("div",{className:"finish-screen"},
    React.createElement("div",{className:"finish-emoji"},"🎉"),
    React.createElement("div",{className:"finish-title"},"Alle Karten gewusst!"),
    React.createElement("div",{className:"finish-sub"},"Super gemacht! Du hast alle Karten in diesem Durchgang richtig beantwortet."),
    React.createElement("button",{className:"btn primary",style:{maxWidth:"240px",marginTop:"8px"},onClick:onDone},"Zurück zur Übersicht")
  );

  const karte=offene[Math.min(idx,offene.length-1)];
  function flip(){setFlipped(f=>!f)}
  function next(gewusst){
    if(gewusst){
      richtigGewusst(karte.id);
      const updated=local.map(k=>k.id===karte.id?{...k,richtig:k.richtig+1}:k);
      setLocal(updated);
      const neu=updated.filter(k=>k.richtig<3);
      if(!neu.length){setFertig(true);return;}
      setFlipped(false);setIdx(i=>Math.min(i,neu.length-1));
    } else {
      setFlipped(false);
      setIdx(i=>(i+1)%offene.length);
    }
  }

  return React.createElement("div",{className:"learn-screen"},
    React.createElement("div",{className:"learn-top"},
      React.createElement("button",{className:"btn-icon",onClick:onDone},"×"),
      React.createElement("span",{className:"learn-counter"},(Math.min(idx,offene.length-1)+1)+" / "+offene.length),
      React.createElement("div",{className:"progress-dots"},
        offene.slice(0,Math.min(offene.length,8)).map((_,i)=>React.createElement("div",{key:i,className:"pdot"+(i<idx?" done":i===idx?" active":"")}))
      )
    ),
    React.createElement("div",{className:"card-flip-wrap",onClick:flip},
      React.createElement("div",{className:"card-flip"+(flipped?" flipped":"")},
        React.createElement("div",{className:"card-face"},
          React.createElement("div",{className:"card-badge badge-q"},"FRAGE"),
          React.createElement("div",{className:"card-text"},karte.frage),
          React.createElement("div",{className:"card-pips"},[0,1,2].map(i=>React.createElement("div",{key:i,className:"pip"+(i<karte.richtig?" filled":"")})))
        ),
        React.createElement("div",{className:"card-face back"},
          React.createElement("div",{className:"card-badge badge-a"},"ANTWORT"),
          React.createElement("div",{className:"card-text"},karte.antwort)
        )
      )
    ),
    React.createElement("div",{className:"hint"},flipped?"War das richtig?":"Tippe zum Umdrehen"),
    flipped&&React.createElement("div",{className:"action-btns"},
      React.createElement("button",{className:"action-btn wrong",onClick:()=>next(false)},"✕  Nicht gewusst"),
      React.createElement("button",{className:"action-btn right",onClick:()=>next(true)},"✓  Gewusst!")
    )
  );
}

function StapelModal({onClose,onSave}){
  const [name,setName]=useState("");const [emoji,setEmoji]=useState("📚");
  return React.createElement("div",{className:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget)onClose()}},
    React.createElement("div",{className:"modal"},
      React.createElement("div",{className:"modal-handle"}),
      React.createElement("div",{className:"modal-header"},React.createElement("span",{className:"modal-title"},"Neuer Stapel"),React.createElement("button",{className:"btn-icon",onClick:onClose},"×")),
      React.createElement("div",{className:"form-section"},React.createElement("div",{className:"form-label"},"Name des Stapels"),React.createElement("input",{className:"form-input",placeholder:"z. B. Biologie",value:name,onChange:e=>setName(e.target.value),autoFocus:true})),
      React.createElement("div",{className:"form-section"},React.createElement("div",{className:"form-label"},"Symbol wählen"),React.createElement("div",{className:"emoji-grid"},EMOJIS.map(e=>React.createElement("button",{key:e,className:"emoji-pick"+(emoji===e?" selected":""),onClick:()=>setEmoji(e)},e)))),
      React.createElement("div",{className:"btn-row"},React.createElement("button",{className:"btn",onClick:onClose},"Abbrechen"),React.createElement("button",{className:"btn primary",disabled:!name.trim(),onClick:()=>onSave(name.trim(),emoji)},"Erstellen"))
    )
  );
}

function KarteModal({onClose,onSave}){
  const [frage,setFrage]=useState("");const [antwort,setAntwort]=useState("");
  function add(){if(frage.trim()&&antwort.trim()){onSave(frage.trim(),antwort.trim());setFrage("");setAntwort("");}}
  return React.createElement("div",{className:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget)onClose()}},
    React.createElement("div",{className:"modal"},
      React.createElement("div",{className:"modal-handle"}),
      React.createElement("div",{className:"modal-header"},React.createElement("span",{className:"modal-title"},"Neue Karte"),React.createElement("button",{className:"btn-icon",onClick:onClose},"×")),
      React.createElement("div",{className:"form-section"},React.createElement("div",{className:"form-label"},"Frage / Vorderseite"),React.createElement("textarea",{className:"form-input",rows:3,placeholder:"z. B. Was ist Photosynthese?",value:frage,onChange:e=>setFrage(e.target.value),autoFocus:true})),
      React.createElement("div",{className:"form-section"},React.createElement("div",{className:"form-label"},"Antwort / Rückseite"),React.createElement("textarea",{className:"form-input",rows:3,placeholder:"z. B. Umwandlung von Licht in Energie...",value:antwort,onChange:e=>setAntwort(e.target.value)})),
      React.createElement("div",{className:"btn-row"},
        React.createElement("button",{className:"btn",onClick:onClose},"Schließen"),
        React.createElement("button",{className:"btn primary",disabled:!frage.trim()||!antwort.trim(),onClick:add},"Hinzufügen")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
